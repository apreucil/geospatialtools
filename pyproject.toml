[build-system]
requires = ["setuptools>=61.0", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatialtools"
version = "0.1.0"
description = "Geospatial tools for terrain and upscaling operations"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools]
packages = ["geospatialtools"]

[tool.setuptools.extension-modules]
terrain_tools_fortran = { sources = ["src/planchon_2001.f90", "src/terrain_tools.f90"], extra_compile_args = ["-fPIC", "-Wall", "-pedantic", "-O3"] }
upscaling_tools_fortran = { sources = ["src/upscaling_tools.f90"], extra_compile_args = ["-fPIC", "-Wall", "-pedantic", "-O3"] }